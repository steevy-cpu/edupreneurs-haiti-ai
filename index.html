    <!-- Critical CSS for fast first paint -->
    <style>
      /* Critical above-the-fold styles */
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; }
      #root { min-height: 100vh; }
      .hero-skeleton { 
        background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer { to { background-position: -200% 0; } }
      .loading-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        .loading-placeholder { background: #0a0a0a; }
        .hero-skeleton { background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%); }
      }
    </style>

      "potentialAction": {

        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Mermaid for diagrams -->
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ 
        startOnLoad: true, 
        theme: 'default',
        themeVariables: {
          primaryColor: '#e3f2fd',
          primaryTextColor: '#1976d2',
          primaryBorderColor: '#1976d2',
          lineColor: '#1976d2',
          secondaryColor: '#f3e5f5',
          tertiaryColor: '#e8f5e9',
          background: '#ffffff',
          mainBkg: '#ffffff',
          secondBkg: '#f5f5f5',
          labelBackground: '#ffffff',
          fontFamily: 'ui-sans-serif, system-ui, sans-serif',
          fontSize: '14px'
        },
        flowchart: {
          htmlLabels: true,
          curve: 'basis',
          padding: 15
        }
      });
      
      // Re-render mermaid diagrams when content changes
      const observer = new MutationObserver(() => {
        mermaid.init(undefined, document.querySelectorAll('.mermaid:not([data-processed])'));
      });
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    </script>
