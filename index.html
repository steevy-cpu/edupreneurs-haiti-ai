    <!-- Critical CSS for fast first paint - covers header and hero section -->
    <style>
      /* Critical above-the-fold styles */
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: var(--background, #ffffff); color: var(--foreground, #0a0a0a); }
      #root { min-height: 100vh; }
      
      /* Header critical styles */
      header { position: sticky; top: 0; z-index: 50; background: var(--card, rgba(255,255,255,0.95)); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
      header > div { max-width: 1280px; margin: 0 auto; padding: 0.5rem 1rem; display: flex; justify-content: space-between; align-items: center; }
      header a { display: flex; align-items: center; gap: 0.375rem; text-decoration: none; }
      header img { height: 2rem; width: auto; object-fit: contain; }
      
      /* Hero section critical styles */
      .container { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
      
      /* Loading skeleton */
      .hero-skeleton { 
        background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer { to { background-position: -200% 0; } }
      .loading-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #fafafa;
      }
      
      /* Dark mode critical styles */
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #fafafa; }
        header { background: rgba(10,10,10,0.95); border-bottom-color: rgba(255,255,255,0.05); }
        .loading-placeholder { background: #0a0a0a; }
        .hero-skeleton { background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%); }
      }
    </style>

      },

      ]
    }
    </script>
    
    <!-- FOUT prevention — apply dark class before first paint -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('edupreneur-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === '"dark"' || theme === 'dark' || ((!theme || theme === '"system"' || theme === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "EDUPRENEURS",
      "url": "https://mon-edupreneur.com",
      "potentialAction": {

        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <body>
    <div id="root">
      <!-- Static HTML shell - visible immediately (0ms) before React hydrates -->
      <header style="position:sticky;top:0;z-index:50;background:var(--card, rgba(255,255,255,0.95));backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.05);">
        <div style="max-width:1280px;margin:0 auto;padding:0.5rem 1rem;display:flex;justify-content:space-between;align-items:center;">

            <img src="/images/edupreneurs-new-logo-128w.webp" srcset="/images/edupreneurs-new-logo-64w.webp 64w, /images/edupreneurs-new-logo-128w.webp 128w" sizes="(max-width: 640px) 32px, 48px" alt="Edupreneurs" height="32" width="48" style="height:2rem;width:auto;" fetchpriority="high" />

          </div>
        </div>
      </header>
      
      <!-- Hero skeleton - shows structure before React hydrates -->
      <main style="padding:1.5rem 1rem;">
        <div style="max-width:1280px;margin:0 auto;display:grid;gap:2rem;align-items:center;" class="hero-grid">
          <!-- Left content skeleton -->
          <div>
            <div class="hero-skeleton" style="width:12rem;height:2rem;border-radius:9999px;margin-bottom:1rem;"></div>
            <div class="hero-skeleton" style="width:100%;max-width:28rem;height:2.5rem;border-radius:0.5rem;margin-bottom:0.5rem;"></div>
            <div class="hero-skeleton" style="width:75%;height:2.5rem;border-radius:0.5rem;margin-bottom:1rem;"></div>
            <div class="hero-skeleton" style="width:100%;max-width:24rem;height:1.25rem;border-radius:0.25rem;margin-bottom:0.5rem;"></div>
            <div class="hero-skeleton" style="width:80%;height:1.25rem;border-radius:0.25rem;margin-bottom:1.5rem;"></div>
            <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
              <div class="hero-skeleton" style="width:12rem;height:3rem;border-radius:0.5rem;"></div>
              <div class="hero-skeleton" style="width:10rem;height:3rem;border-radius:0.5rem;"></div>
            </div>
          </div>
          <!-- Right image skeleton (hidden on mobile) -->
          <div class="hero-image-skeleton" style="display:none;justify-content:center;">
            <div class="hero-skeleton" style="width:16rem;height:16rem;border-radius:9999px;"></div>
          </div>
        </div>
      </main>
    </div>
    <style>
      /* Grid layout for hero skeleton */
      @media (min-width: 768px) {
        .hero-grid { grid-template-columns: 1fr 1fr; }
        .hero-image-skeleton { display: flex !important; }
      }
      /* Dark mode for static shell */
      @media (prefers-color-scheme: dark) {
        #root > header { background: rgba(10,10,10,0.95); border-bottom-color: rgba(255,255,255,0.05); }
