    <!-- Mermaid for diagrams - only load when diagrams exist on page -->
    <script type="module">
      // Mermaid loader - only imports when .mermaid elements are found
      let mermaidLoaded = false;
      
      const loadMermaid = async () => {
        const mermaidElements = document.querySelectorAll('.mermaid:not([data-processed])');
        if (mermaidElements.length === 0) return;
        
        if (!mermaidLoaded) {
          const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs');
          mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            themeVariables: {
              primaryColor: '#e3f2fd',
              primaryTextColor: '#1976d2',
              primaryBorderColor: '#1976d2',
              lineColor: '#1976d2',
              secondaryColor: '#f3e5f5',
              tertiaryColor: '#e8f5e9',
              background: '#ffffff',
              mainBkg: '#ffffff',
              secondBkg: '#f5f5f5',
              labelBackground: '#ffffff',
              fontFamily: 'ui-sans-serif, system-ui, sans-serif',
              fontSize: '14px'
            },
            flowchart: {
              htmlLabels: true,
              curve: 'basis',
              padding: 15
            }
          });
          window.mermaidInstance = mermaid;
          mermaidLoaded = true;
        }
        window.mermaidInstance.run({ nodes: mermaidElements });
      };
      
      // Only observe for mermaid diagrams - don't load eagerly
      const observer = new MutationObserver((mutations) => {
        // Check if any added nodes contain mermaid diagrams
        for (const mutation of mutations) {
          for (const node of mutation.addedNodes) {
            if (node.nodeType === 1) {
              if (node.classList?.contains('mermaid') || node.querySelector?.('.mermaid')) {
                loadMermaid();
                return;
              }
            }
          }
        }
      });
      
      // Start observing after DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          observer.observe(document.body, { childList: true, subtree: true });
          // Check if diagrams already exist
          if (document.querySelector('.mermaid')) loadMermaid();
        });
      } else {
        observer.observe(document.body, { childList: true, subtree: true });
        if (document.querySelector('.mermaid')) loadMermaid();
      }
    </script>
